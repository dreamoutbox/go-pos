{{define "content"}}
<div class="row justify-content-center">
    <div class="col-12 col-lg-10">
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold mb-1"><i class="bi bi-file-earmark-plus me-2 text-info"></i>Issue Debit Note
                        (DBN)</h4>
                    <p class="text-muted small mb-0">For Order: <strong>{{if
                            .order.Code}}{{.order.Code}}{{else}}#{{.order.ID}}{{end}}</strong></p>
                </div>
                <a href="/orders/{{.order.ID}}" class="btn btn-outline-secondary btn-sm"><i
                        class="bi bi-arrow-left me-1"></i>Back to Order</a>
            </div>

            <form id="dbnForm" onsubmit="submitDebitNote(event)">
                <div class="mb-4">
                    <label for="reason" class="form-label small fw-semibold text-muted">Reason for Debit Note <span
                            class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="reason" name="reason"
                        placeholder="e.g. Additional items delivered, undercharged price correction, express shipping fee"
                        required>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold mb-0 text-secondary text-uppercase"
                        style="font-size: 0.75rem; letter-spacing: 0.05em;">Debit Items & Fee Adjustments</h6>
                    <button type="button" class="btn btn-outline-primary btn-sm" onclick="addDebitRow()">
                        <i class="bi bi-plus-lg me-1"></i>Add Row
                    </button>
                </div>

                <!-- Hidden Master Product Options Template for JS -->
                <select id="productsMaster" style="display: none;">
                    <option value="">-- Custom Fee / Adjustment --</option>
                    {{range .products}}
                    <option value="{{.ID}}" data-name="{{.Name}}" data-price="{{.Price}}">{{.Name}} (฿{{.Price}})
                    </option>
                    {{end}}
                </select>

                <div class="table-responsive mb-4">
                    <table class="table align-middle border" id="debitItemsTable">
                        <thead class="bg-light">
                            <tr class="text-muted small">
                                <th>Item / Fee Name</th>
                                <th style="width: 140px;" class="text-end">Price (฿)</th>
                                <th style="width: 100px;" class="text-end">Qty</th>
                                <th style="width: 120px;" class="text-center">Deduct Stock?</th>
                                <th style="width: 50px;"></th>
                            </tr>
                        </thead>
                        <tbody id="dbnRowsContainer">
                            <!-- Dynamic Rows -->
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="/orders/{{.order.ID}}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-info text-white px-4" id="submitBtn">
                        <i class="bi bi-file-earmark-check me-1"></i>Generate Debit Note
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function addDebitRow(name = "", price = 0, qty = 1, prodId = "") {
        const tbody = document.getElementById("dbnRowsContainer");
        const rowId = "row_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
        const masterOptions = document.getElementById("productsMaster").innerHTML;

        const tr = document.createElement("tr");
        tr.id = rowId;
        tr.innerHTML = `
        <td>
            <select class="form-select form-select-sm mb-1 prod-select" onchange="onProductSelect(this, '${rowId}')">
                ${masterOptions}
            </select>
            <input type="text" class="form-control form-control-sm item-name-input" placeholder="Custom description..." value="${name}">
        </td>
        <td>
            <input type="number" step="0.01" min="0" class="form-control form-control-sm text-end item-price-input" value="${price}">
        </td>
        <td>
            <input type="number" min="1" class="form-control form-control-sm text-end item-qty-input" value="${qty}">
        </td>
        <td class="text-center">
            <div class="form-check form-switch d-inline-block">
                <input class="form-check-input item-stock-input" type="checkbox" ${prodId ? "checked" : ""}>
            </div>
        </td>
        <td class="text-center">
            <button type="button" class="btn btn-link text-danger p-0" onclick="removeRow('${rowId}')"><i class="bi bi-trash"></i></button>
        </td>
    `;
        tbody.appendChild(tr);

        if (prodId) {
            const select = tr.querySelector(".prod-select");
            select.value = prodId;
        }
    }

    function onProductSelect(selectElem, rowId) {
        const selectedOpt = selectElem.options[selectElem.selectedIndex];
        const row = document.getElementById(rowId);
        const nameInput = row.querySelector(".item-name-input");
        const priceInput = row.querySelector(".item-price-input");
        const stockInput = row.querySelector(".item-stock-input");

        if (selectElem.value) {
            const name = selectedOpt.getAttribute("data-name");
            const price = selectedOpt.getAttribute("data-price");
            if (name) nameInput.value = name;
            if (price) priceInput.value = price;
            stockInput.checked = true;
        } else {
            stockInput.checked = false;
        }
    }

    function removeRow(rowId) {
        const row = document.getElementById(rowId);
        if (row) row.remove();
    }

    function submitDebitNote(e) {
        e.preventDefault();

        const reason = document.getElementById("reason").value;
        const rows = document.querySelectorAll("#dbnRowsContainer tr");
        const items = [];

        rows.forEach(row => {
            const prodIdVal = row.querySelector(".prod-select").value;
            const name = row.querySelector(".item-name-input").value;
            const price = parseFloat(row.querySelector(".item-price-input").value) || 0;
            const qty = parseInt(row.querySelector(".item-qty-input").value) || 0;
            const deductStock = row.querySelector(".item-stock-input").checked;

            if (price >= 0 && qty > 0 && (name.trim() !== "" || prodIdVal)) {
                items.push({
                    product_id: prodIdVal ? parseInt(prodIdVal) : null,
                    name: name,
                    price: price,
                    quantity: qty,
                    deduct_stock: deductStock
                });
            }
        });

        if (items.length === 0) {
            alert("Please add at least 1 valid item/fee to the Debit Note.");
            return;
        }

        document.getElementById("submitBtn").disabled = true;

        fetch("/orders/{{.order.ID}}/debit_note", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                reason: reason,
                items: items
            })
        })
            .then(res => res.json())
            .then(data => {
                if (data.debit_note_id) {
                    alert("Debit Note " + data.code + " issued successfully!");
                    window.location.href = "/debit_notes/" + data.debit_note_id;
                } else if (data.error) {
                    alert("Error: " + data.error);
                    document.getElementById("submitBtn").disabled = false;
                }
            })
            .catch(err => {
                console.error(err);
                alert("Failed to submit Debit Note.");
                document.getElementById("submitBtn").disabled = false;
            });
    }

    window.onload = function () {
        addDebitRow();
    };
</script>
{{end}}
