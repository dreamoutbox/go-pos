<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>500 Internal Server Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="text-center shadow p-5 bg-white rounded" style="max-width: 450px;">
        <h1 class="display-1 text-danger fw-bold">500</h1>
        <h3 class="fw-semibold">Internal Server Error</h3>
        <p class="text-muted mt-3">{{if .error}}{{.error}}{{else}}Something went wrong on our end. Please try again
            later.{{end}}</p>
        <a href="/" class="btn btn-primary mt-4">Go to Dashboard</a>
    </div>
</body>

</html>
