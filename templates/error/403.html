<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>403 Forbidden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="text-center shadow p-5 bg-white rounded" style="max-width: 450px;">
        <h1 class="display-1 text-danger fw-bold">403</h1>
        <h3 class="fw-semibold">Access Denied</h3>
        <p class="text-muted mt-3">{{.error}}</p>
        <a href="/" class="btn btn-primary mt-4">Go to Dashboard</a>
    </div>
</body>
</html>
