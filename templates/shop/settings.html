{{define "content"}}
<div class="container-fluid py-4 px-4 main-content">
    <div class="card p-4" style="max-width: 600px; margin: 0 auto;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1"><i class="bi bi-gear me-2 text-primary"></i>Shop Settings</h4>
                <p class="text-muted small mb-0">Update your shop's public information.</p>
            </div>
        </div>

        {{if .msg}}
        <div class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <i class="bi bi-check-circle me-2"></i>{{.msg}}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {{end}}

        {{if .error}}
        <div class="alert alert-danger mb-4">
            <i class="bi bi-exclamation-triangle me-2"></i>{{.error}}
        </div>
        {{end}}

        <form action="/shop/settings" method="POST">
            <input type="hidden" name="_method" value="PATCH">

            <div class="mb-3">
                <label for="name" class="form-label small fw-semibold text-muted">Shop / Outlet Name <span
                        class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" name="name"
                    value="{{if .input}}{{.input.Name}}{{else}}{{.targetShop.Name}}{{end}}" required>
                {{if .errors.Name}}
                <div class="text-danger small mt-1"><i class="bi bi-exclamation-circle me-1"></i>{{.errors.Name}}
                </div>
                {{end}}
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label small fw-semibold text-muted">Phone Number</label>
                <input type="text" class="form-control" id="phone" name="phone"
                    value="{{if .input}}{{.input.Phone}}{{else}}{{.targetShop.Phone}}{{end}}">
            </div>

            <div class="mb-4">
                <label for="address" class="form-label small fw-semibold text-muted">Address</label>
                <textarea class="form-control" id="address" name="address"
                    rows="3">{{if .input}}{{.input.Address}}{{else}}{{.targetShop.Address}}{{end}}</textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-save me-2"></i>Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}
