<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Go POS</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
        }
        .btn-indigo {
            background-color: #4f46e5;
            color: white;
            border: none;
            font-weight: 500;
            padding: 0.75rem;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        .btn-indigo:hover {
            background-color: #4338ca;
            color: white;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.25);
        }
    </style>
</head>
<body>
    <div class="card login-card p-4">
        <div class="card-body">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">Welcome to Go POS</h3>
                <p class="text-muted small">Log in to manage your shop sales & stock</p>
            </div>
            
            {{if .error}}
            <div class="alert alert-danger d-flex align-items-center py-2 px-3 mb-3" role="alert">
                <div class="small">{{.error}}</div>
            </div>
            {{end}}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-muted">Email Address</label>
                    <input type="email" class="form-control py-2" id="email" name="email" value="{{if .input}}{{.input.Email}}{{end}}" placeholder="name@domain.com" required>
                    {{if .errors.Email}}
                    <div class="text-danger small mt-1">{{.errors.Email}}</div>
                    {{end}}
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold text-muted">Password</label>
                    <input type="password" class="form-control py-2" id="password" name="password" placeholder="••••••••" required>
                    {{if .errors.Password}}
                    <div class="text-danger small mt-1">{{.errors.Password}}</div>
                    {{end}}
                </div>
                
                <button type="submit" class="btn btn-indigo w-100 mb-2">Log In</button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted small">First run admin seeding info: <br> Email: <code>admin@pos.local</code> Password: <code>admin</code></span>
            </div>
        </div>
    </div>
</body>
</html>
