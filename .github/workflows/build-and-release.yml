name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build Binary & Package
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/go-pos-linux-amd64 .
          tar -czvf dist/go-pos-linux-amd64.tar.gz dist/go-pos-linux-amd64 templates static

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/go-pos-linux-amd64
            dist/go-pos-linux-amd64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
